name: test

# Every test file of tests/ runs here, in groups of about five minutes
# each, only when the engine or its tests change (tests/test_tools.py checks
# that none is left out, and says why for any file under tests/ that is not
# a test). The seconds-fast tests also run before push
# (.pre-commit-config.yaml).
on:
  pull_request:
    paths:
      - "lua/**"
      - "tex/**"
      - "tests/**"
      # The tools the tests run, and the files they read (tests/test_tools.py
      # checks that none the tests name is missing here).
      - "tools/**"
      - "justfile"
      - "docs/testing.md"
      - "site/src/lib/scene-ops.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dealt out by CPU seconds on a laptop (just test-times 4 on the
        # tree of 2026-11-25): 303 to 318 s a group. To deal them out again
        # run just test-times 4 first, then python3 -I tools/test_times.py
        # groups build/test-times.tsv 14 --skip tools_matrix: that file is
        # the latest run's, and no times are kept with the repository
        # (docs/testing.md). The heavy pattern and flora band tests are
        # split in parts (tests/split.lua) so that none is more than a
        # group's share. tools_matrix has the job below.
        tests:
          - pattern_matrix_1 perimeter_flora_2
          - compose perimeter_flora_4
          - perimeter_flora_1 perimeter_flora_3
          - pattern pattern_matrix_3 raster
          - ornaments pattern_reach_2
          - garden header_mark pattern_protect
          - backdrop pattern_perimeter_1 progression
          - bake headpiece pattern_perimeter_3 plant row_phase titles visitor
          - clock frame_matrix lint pattern_perimeter_4
          - core grow leaf pattern_colourways pattern_perimeter_2 prepare_spec reserve scene_ops settings
          - floret_passes page_cache pattern_reach_1 preview stem_taper support
          - layout pattern_matrix_2 relief tools
          - gilt_look mix pattern_matrix_4 pattern_values
          - cache_key catalog inline letters pattern_ground pattern_reach_3 pdf_form_cache progression_frame_resources render_page
    steps:
      - uses: actions/checkout@v4
      - name: texlua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-binaries time >/dev/null
      - name: tests
        run: |
          set -e
          for t in ${{ matrix.tests }}; do tools/test.sh $t; done

  tools:
    # Every call the measuring tools document (docs/testing.md); the rows
    # for the container are skipped here (TOOLS_MATRIX_DOCKER=0): building its image takes minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: texlua, time and just
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-binaries time pipx >/dev/null
          pipx install rust-just==1.40.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: tools_matrix
        env:
          TOOLS_MATRIX_DOCKER: "0"
        run: tools/test.sh tools_matrix

  progression-raster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raster dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-binaries poppler-utils python3-pil >/dev/null
      - name: Progression raster integration
        run: /usr/bin/python3 tests/test_progression_raster.py

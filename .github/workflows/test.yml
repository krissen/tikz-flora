name: test

# The engine's Lua tests, in groups of a few minutes each, only when the
# engine or its tests change. The groups name 30 of the 44 test files; the
# other 14 (the pattern tests among them) are not run here yet, and
# docs/testing.md lists them. The seconds-fast tests also run before push
# (.pre-commit-config.yaml).
on:
  pull_request:
    paths:
      - "lua/**"
      - "tex/**"
      - "tests/**"
      - "tools/test.sh"
      - "tools/tune_json.lua"
      - "tools/bake_tune.py"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Grouped by CPU seconds on a laptop (just test-times, 2026-11):
        # mix 123, scene_ops 83, header_mark 140 | compose 186, ornaments
        # 92, progression 42 | layout 117, clock 56, visitor 22 and the fast
        # set | support 87, titles 34, backdrop 22, raster 12 and the rest.
        tests:
          - mix scene_ops header_mark
          - compose ornaments progression
          - layout clock visitor fast page_cache cache_key
          - support raster relief gilt_look backdrop catalog garden titles
    steps:
      - uses: actions/checkout@v4
      - name: texlua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-binaries >/dev/null
      - name: tests
        run: |
          set -e
          for t in ${{ matrix.tests }}; do tools/test.sh $t; done

  progression-raster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raster dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-binaries poppler-utils python3-pil >/dev/null
      - name: Progression raster integration
        run: /usr/bin/python3 tests/test_progression_raster.py
